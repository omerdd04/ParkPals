name: Deploy to GitHub Pages

# Builds the app and publishes it to a `gh-pages` branch. On the live github.io
# domain the real OpenStreetMap street tiles load (unlike the sandboxed preview),
# so the map shows real streets.
#
# One-time setup by the repo owner: Settings → Pages → Build and deployment →
# Source: "Deploy from a branch" → Branch: gh-pages / (root) → Save.
# The site then lives at https://omerdd04.github.io/Onyx-Digital/

on:
  push:
    branches:
      - main
      - claude/dog-park-social-app-4zwvvv
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        env:
          GITHUB_PAGES: 'true'
        run: npm run build
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
